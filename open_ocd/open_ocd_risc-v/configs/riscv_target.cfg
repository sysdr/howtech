# RISC-V SoC Target Configuration
# This example is for a single-core RV32IMAC or RV64IMAC system

# JTAG TAP declaration
# IR length and IDCODE must match hardware exactly!
# Check your SoC datasheet for these values

# Example: SiFive E31 Core
set _CHIPNAME riscv
set _TARGETNAME $_CHIPNAME.cpu

# Declare JTAG TAP
# irlen: Instruction Register length in bits (usually 5 for RISC-V)
# expected-id: IDCODE from JTAG scan (manufacturer + part number + version)
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x10e31913

# If IDCODE doesn't match (different revision), use -ignore-version
# jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x10e31913 -ignore-version

# Create RISC-V target
target create $_TARGETNAME riscv -chain-position $_TARGETNAME

# Enable multi-core support (even for single core - better GDB integration)
$_TARGETNAME configure -rtos hwthread

# RISC-V Debug Module preferences
# Prefer System Bus Access for faster memory operations
riscv set_prefer_sba on

# Disable virtual memory translation during debug (simpler)
riscv set_enable_virtual off

# Command timeout (seconds) - increase for slow JTAG or complex operations
riscv set_command_timeout_sec 10

# Expose important CSRs to GDB
# Format: address=name
# misa (0xf10=3856), mvendorid (0xf11=3857), marchid (0xf12=3858), mimpid (0xf13=3859)
riscv expose_csrs 3856=misa,3857=mvendorid,3858=marchid,3859=mimpid
riscv expose_csrs 3072=mstatus,3073=misa,3088=mscratch

# Memory map (adjust for your SoC)
# These are examples - must match your actual hardware!

# Flash at 0x20000000, 128MB
# flash bank $_FLASHNAME cfi 0x20000000 0x8000000 2 2 $_TARGETNAME

# RAM at 0x80000000, 128MB
# Not defining flash/RAM here - do this in board-specific config

# Configure examine-defer for multi-core or power-gated systems
# This prevents OpenOCD from examining cores before they're powered on
# Uncomment if you see "Examine failed" errors:
# $_TARGETNAME configure -defer-examine

# Event handlers
$_TARGETNAME configure -event reset-init {
    echo "Target reset complete"
    # Insert initialization commands here
    # Example: configure DDR, load bootloader, etc.
}

# Work area for algorithm execution (must be in RAM)
# $_TARGETNAME configure -work-area-phys 0x80000000 -work-area-size 0x10000 -work-area-backup 1

# Debug level (0=errors only, 3=verbose)
debug_level 2
