# FTDI FT2232H-based debug adapter configuration
# Common adapters: Olimex ARM-USB-OCD-H, Tigard, TIAO USB Multi-Protocol Adapter

adapter driver ftdi

# USB VID/PID for FTDI FT2232H
ftdi_vid_pid 0x0403 0x6010

# Channel selection (0 = Channel A, 1 = Channel B)
ftdi_channel 0

# Layout: defines which pins are TCK, TDI, TDO, TMS
# FT2232H MPSSE: ADBUS0=TCK, ADBUS1=TDI, ADBUS2=TDO, ADBUS3=TMS
ftdi_layout_init 0x0008 0x000b

# Reset configuration
# nTRST = ADBUS4 (bit 4), nSRST = ADBUS5 (bit 5)
ftdi_layout_signal nTRST -data 0x0010 -oe 0x0010
ftdi_layout_signal nSRST -data 0x0020 -oe 0x0020

# Start with conservative 100 kHz - increase after verifying stability
adapter speed 100

# Reset timing - critical for reliable operation
adapter srst pulse_width 100
adapter srst delay 100
reset_config trst_and_srst separate

# Enable RTCK (Return TCK) if adapter supports it for adaptive clocking
# Commented out by default - not all adapters support this
# ftdi_layout_signal RTCK -nalias TDO
