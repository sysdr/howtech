global
    maxconn 4096
    log stdout format raw local0

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000
    timeout client  50000
    timeout server  50000
    stats enable
    stats uri /haproxy-stats
    stats refresh 5s

frontend http-in
    bind *:8080
    default_backend kong-gateway
    # Add custom header to track LB
    http-request set-header X-Load-Balancer "HAProxy"
    http-response set-header X-LB-Backend %[be_name]

backend kong-gateway
    balance roundrobin
    option httpchk GET /
    http-check expect status 200,404
    server kong1 kong1:8000 check
    server kong2 kong2:8000 check
