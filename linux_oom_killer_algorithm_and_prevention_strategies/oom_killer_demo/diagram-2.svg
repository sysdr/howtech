<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#f5f5f5"/>
  <text x="400" y="30" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle">OOM Killer Decision Process</text>
  
  <!-- Start -->
  <ellipse cx="400" cy="80" rx="100" ry="40" fill="#c8e6c9" stroke="#388e3c" stroke-width="2"/>
  <text x="400" y="90" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">System Out</text>
  <text x="400" y="105" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">of Memory</text>
  
  <!-- Scan processes -->
  <rect x="300" y="180" width="200" height="60" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="5"/>
  <text x="400" y="210" font-family="Arial" font-size="14" text-anchor="middle">Scan All Processes</text>
  <text x="400" y="230" font-family="Arial" font-size="12" text-anchor="middle">Calculate oom_score for each</text>
  
  <!-- Sort -->
  <rect x="300" y="280" width="200" height="60" fill="#e1bee7" stroke="#7b1fa2" stroke-width="2" rx="5"/>
  <text x="400" y="310" font-family="Arial" font-size="14" text-anchor="middle">Sort by oom_score</text>
  <text x="400" y="330" font-family="Arial" font-size="12" text-anchor="middle">Highest score first</text>
  
  <!-- Check immune -->
  <rect x="300" y="380" width="200" height="60" fill="#ffcdd2" stroke="#c62828" stroke-width="2" rx="5"/>
  <text x="400" y="410" font-family="Arial" font-size="14" text-anchor="middle">Check Immunity</text>
  <text x="400" y="430" font-family="Arial" font-size="12" text-anchor="middle">Skip if adj = -1000</text>
  
  <!-- Kill -->
  <rect x="250" y="480" width="150" height="60" fill="#ffcdd2" stroke="#c62828" stroke-width="3" rx="5"/>
  <text x="325" y="510" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Kill Process</text>
  <text x="325" y="530" font-family="Arial" font-size="12" text-anchor="middle">Send SIGKILL</text>
  
  <!-- Retry -->
  <rect x="450" y="480" width="150" height="60" fill="#fff9c4" stroke="#f57f17" stroke-width="2" rx="5"/>
  <text x="525" y="510" font-family="Arial" font-size="14" text-anchor="middle">Memory</text>
  <text x="525" y="530" font-family="Arial" font-size="12" text-anchor="middle">Still Low?</text>
  
  <!-- Arrows -->
  <path d="M 400 120 L 400 170" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 400 240 L 400 270" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 400 340 L 400 370" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 350 440 L 300 470" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 450 440 L 500 470" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 525 480 L 525 440 L 400 440 L 400 450" stroke="#333" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="50" y="450" width="150" height="120" fill="white" stroke="#ccc" stroke-width="1" rx="5"/>
  <text x="125" y="470" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Score Ranges</text>
  <text x="60" y="495" font-family="Arial" font-size="11">Low: &lt;200</text>
  <text x="60" y="515" font-family="Arial" font-size="11">Med: 200-400</text>
  <text x="60" y="535" font-family="Arial" font-size="11">High: &gt;400</text>
  <text x="60" y="555" font-family="Arial" font-size="11">Immune: adj=-1000</text>
</svg>
