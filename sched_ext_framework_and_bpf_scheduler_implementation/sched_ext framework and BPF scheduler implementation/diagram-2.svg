<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" style="background: white;">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    <style>
      .state-box { fill: #E8EAF6; stroke: #3F51B5; stroke-width: 2.5; }
      .hook-box { fill: #FFF3E0; stroke: #FF6F00; stroke-width: 2; }
      .queue-op { fill: #E1F5FE; stroke: #0277BD; stroke-width: 2; }
      .arrow { stroke: #37474F; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
      .dashed { stroke-dasharray: 6,4; }
      .label { font-family: 'Courier New', monospace; font-size: 13px; fill: #212121; }
      .state-label { font-family: Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #1A237E; }
      .hook-label { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #E65100; }
      .annotation { font-family: Arial, sans-serif; font-size: 10px; fill: #546E7A; font-style: italic; }
      .title { font-family: Arial, sans-serif; font-size: 17px; font-weight: bold; fill: #1976D2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#37474F" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="450" y="35" class="title" text-anchor="middle">Task Lifecycle Through sched_ext BPF Hooks</text>
  
  <!-- State: NEW -->
  <g filter="url(#shadow)">
    <rect x="50" y="80" width="140" height="70" rx="10" class="state-box"/>
    <text x="120" y="110" class="state-label" text-anchor="middle">NEW</text>
    <text x="120" y="130" class="annotation" text-anchor="middle">Task created</text>
  </g>
  
  <!-- Hook: select_cpu() -->
  <g filter="url(#shadow)">
    <rect x="280" y="85" width="160" height="60" rx="6" class="hook-box"/>
    <text x="360" y="110" class="hook-label" text-anchor="middle">select_cpu()</text>
    <text x="360" y="130" class="annotation" text-anchor="middle">Choose CPU for task</text>
  </g>
  
  <path d="M 190 115 L 280 115" class="arrow"/>
  <text x="220" y="105" class="annotation">Task fork/</text>
  <text x="220" y="118" class="annotation">wakeup</text>
  
  <!-- State: READY (Queue) -->
  <g filter="url(#shadow)">
    <rect x="520" y="80" width="140" height="70" rx="10" class="state-box"/>
    <text x="590" y="110" class="state-label" text-anchor="middle">READY</text>
    <text x="590" y="130" class="annotation" text-anchor="middle">In priority queue</text>
  </g>
  
  <path d="M 440 115 L 520 115" class="arrow"/>
  
  <!-- Hook: enqueue() -->
  <g filter="url(#shadow)">
    <rect x="510" y="190" width="170" height="80" rx="6" class="hook-box"/>
    <text x="595" y="215" class="hook-label" text-anchor="middle">enqueue()</text>
    <text x="595" y="235" class="annotation" text-anchor="middle">Route to queue level</text>
    <rect x="525" y="245" width="140" height="20" rx="3" class="queue-op"/>
    <text x="595" y="260" class="label" text-anchor="middle" font-size="11">bpf_map_push_elem()</text>
  </g>
  
  <path d="M 590 150 L 590 190" class="arrow"/>
  <text x="600" y="175" class="annotation">Task becomes</text>
  <text x="600" y="188" class="annotation">runnable</text>
  
  <!-- Hook: dispatch() -->
  <g filter="url(#shadow)">
    <rect x="280" y="210" width="170" height="100" rx="6" class="hook-box"/>
    <text x="365" y="235" class="hook-label" text-anchor="middle">dispatch()</text>
    <text x="365" y="255" class="annotation" text-anchor="middle">Pull from queue</text>
    <rect x="295" y="265" width="140" height="20" rx="3" class="queue-op"/>
    <text x="365" y="280" class="label" text-anchor="middle" font-size="11">bpf_map_pop_elem()</text>
    <text x="365" y="300" class="annotation" text-anchor="middle" font-size="9">Check HIGH→MED→LOW</text>
  </g>
  
  <path d="M 510 240 L 450 250" class="arrow"/>
  <text x="470" y="235" class="annotation">Scheduler</text>
  <text x="470" y="248" class="annotation">decision</text>
  
  <!-- State: RUNNING -->
  <g filter="url(#shadow)">
    <rect x="50" y="225" width="140" height="70" rx="10" class="state-box"/>
    <text x="120" y="255" class="state-label" text-anchor="middle">RUNNING</text>
    <text x="120" y="275" class="annotation" text-anchor="middle">On CPU</text>
  </g>
  
  <path d="M 280 260 L 190 260" class="arrow"/>
  <text x="220" y="250" class="annotation">Dispatch to</text>
  <text x="220" y="263" class="annotation">CPU runqueue</text>
  
  <!-- Hook: running() -->
  <g filter="url(#shadow)">
    <rect x="50" y="340" width="140" height="70" rx="6" class="hook-box"/>
    <text x="120" y="365" class="hook-label" text-anchor="middle">running()</text>
    <text x="120" y="385" class="annotation" text-anchor="middle">Task starts executing</text>
    <text x="120" y="400" class="annotation" text-anchor="middle" font-size="9">Record timestamp</text>
  </g>
  
  <path d="M 120 295 L 120 340" class="arrow"/>
  <text x="135" y="320" class="annotation">Context</text>
  <text x="135" y="333" class="annotation">switch</text>
  
  <!-- State: BLOCKED -->
  <g filter="url(#shadow)">
    <rect x="280" y="390" width="140" height="70" rx="10" class="state-box"/>
    <text x="350" y="420" class="state-label" text-anchor="middle">BLOCKED</text>
    <text x="350" y="440" class="annotation" text-anchor="middle">I/O wait, sleep</text>
  </g>
  
  <path d="M 190 390 L 280 415" class="arrow" stroke-dasharray="6,4"/>
  <text x="220" y="400" class="annotation">Voluntary</text>
  <text x="220" y="413" class="annotation">block</text>
  
  <!-- Hook: stopping() -->
  <g filter="url(#shadow)">
    <rect x="50" y="480" width="140" height="80" rx="6" class="hook-box"/>
    <text x="120" y="505" class="hook-label" text-anchor="middle">stopping()</text>
    <text x="120" y="525" class="annotation" text-anchor="middle">Task stops running</text>
    <text x="120" y="540" class="annotation" text-anchor="middle" font-size="9">Update runtime stats</text>
    <text x="120" y="553" class="annotation" text-anchor="middle" font-size="9">Check time slice</text>
  </g>
  
  <path d="M 120 410 L 120 480" class="arrow" stroke-dasharray="6,4"/>
  <text x="135" y="450" class="annotation">Yield or</text>
  <text x="135" y="463" class="annotation">preempt</text>
  
  <!-- Preemption path -->
  <path d="M 190 520 L 590 300" class="arrow dashed" stroke="#D32F2F"/>
  <text x="400" y="400" class="annotation" fill="#D32F2F">Preemption: re-enqueue</text>
  <text x="400" y="415" class="annotation" fill="#D32F2F">Task returns to READY</text>
  
  <!-- Wakeup path -->
  <path d="M 420 425 L 590 200" class="arrow dashed" stroke="#388E3C"/>
  <text x="490" y="310" class="annotation" fill="#388E3C">Wake from I/O:</text>
  <text x="490" y="325" class="annotation" fill="#388E3C">back to queue</text>
  
  <!-- Performance metrics box -->
  <g filter="url(#shadow)">
    <rect x="720" y="80" width="160" height="180" rx="8" fill="#FFFDE7" stroke="#F57F17" stroke-width="2"/>
    <text x="800" y="105" class="hook-label" text-anchor="middle">Performance</text>
    <text x="730" y="130" class="annotation">Queue operations:</text>
    <text x="740" y="145" class="label" font-size="11">push: ~50ns</text>
    <text x="740" y="160" class="label" font-size="11">pop: ~50ns</text>
    
    <text x="730" y="185" class="annotation">Dispatch latency:</text>
    <text x="740" y="200" class="label" font-size="11">Local DSQ: ~200ns</text>
    <text x="740" y="215" class="label" font-size="11">Global DSQ: ~2μs</text>
    
    <text x="730" y="240" class="annotation">Context switch:</text>
    <text x="740" y="255" class="label" font-size="11">~1500 cycles</text>
  </g>
  
  <!-- BPF constraints box -->
  <g filter="url(#shadow)">
    <rect x="720" y="290" width="160" height="140" rx="8" fill="#FCE4EC" stroke="#C2185B" stroke-width="2"/>
    <text x="800" y="315" class="hook-label" text-anchor="middle">BPF Constraints</text>
    <text x="730" y="340" class="annotation">Stack limit: 512 bytes</text>
    <text x="730" y="360" class="annotation">Loops: must be bounded</text>
    <text x="740" y="375" class="label" font-size="11">MAX_BATCH=32</text>
    
    <text x="730" y="400" class="annotation">Verifier requires:</text>
    <text x="740" y="415" class="label" font-size="10">- Null checks</text>
    <text x="740" y="427" class="label" font-size="10">- Bounds checking</text>
  </g>
  
  <!-- Data structures box -->
  <g filter="url(#shadow)">
    <rect x="720" y="460" width="160" height="120" rx="8" fill="#E0F2F1" stroke="#00695C" stroke-width="2"/>
    <text x="800" y="485" class="hook-label" text-anchor="middle">BPF Maps Used</text>
    <text x="730" y="510" class="label" font-size="11">BPF_MAP_TYPE_QUEUE</text>
    <text x="740" y="525" class="annotation" font-size="10">3x priority queues</text>
    
    <text x="730" y="545" class="label" font-size="11">BPF_MAP_TYPE_HASH</text>
    <text x="740" y="560" class="annotation" font-size="10">Task metadata</text>
    
    <text x="730" y="575" class="label" font-size="11">BPF_MAP_TYPE_ARRAY</text>
    <text x="740" y="590" class="annotation" font-size="10">Statistics</text>
  </g>
  
  <!-- Legend -->
  <text x="50" y="620" class="annotation" font-weight="bold">Legend:</text>
  <line x1="110" y1="615" x2="150" y2="615" class="arrow"/>
  <text x="155" y="620" class="annotation">State transition</text>
  
  <line x1="270" y1="615" x2="310" y2="615" class="arrow dashed"/>
  <text x="315" y="620" class="annotation">Conditional path</text>
</svg>
